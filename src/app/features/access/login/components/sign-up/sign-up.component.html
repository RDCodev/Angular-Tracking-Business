<form class="form" [formGroup]="signUpForm" (ngSubmit)="null">
  <div class="inputs--row">
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input 
        matInput
        type="text" 
        formControlName="firstName"
      />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input 
        matInput
        type="text" 
        formControlName="lastName"
      />
    </mat-form-field>
  </div>
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input 
      matInput
      type="text" 
      formControlName="username"
    />
    @if(username.invalid) {
      <mat-error>{{ usernameError() }}</mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input 
      matInput
      [type]="hide() ? 'password' : 'text'"
      formControlName="password"
    />
    <button
      mat-icon-button
      matSuffix
      (click)="onHidePassword($event)"
      aria-label="Hide Password"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    @if(password.invalid) {
      <mat-error>{{ passwordError() }}</mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Confirm Password</mat-label>
    <input 
      matInput
      type="password"
      formControlName="confirmPassword"
    />
    @if(confirmPassword.invalid) {
      <mat-error>{{ confirmPasswordError() }}</mat-error>
    }
  </mat-form-field>
  <button type="submit" mat-flat-button [disabled]="signUpForm.invalid">
    Register
  </button>
</form>
