<div class="login__wrapper">
  <div class="login__logo">
    <img src="https://ucarecdn.com/5330ef77-7ab5-49bf-805f-d00e10273cc3/" width="80" alt="">
  </div>
  <div class="login__container">
    <div class="login__header">
      <h1 class="login__title">Sign In</h1>
      <p class="login__description">Dolor dolor lobortis et iriure eros. </p>
    </div>
    <div class="login__content">
      <mat-tab-group
        dynamicHeight 
      >
        <mat-tab
          aria-label="Sign In"
          label="Sign In"
        >
          <ng-container [ngComponentOutlet]="signInComponent"/>
        </mat-tab>
        <mat-tab
          aria-label="Sign Up"
          label="Sign Up"
          disabled
        >
          <ng-container [ngComponentOutlet]="signUpComponent"/>
        </mat-tab>
      </mat-tab-group>
    </div> 
    <div class="login__footer">
      <small class="footer__text">Don't have an account? 
        <a href="#" class="footer__link">Sign Up</a>
      </small>
    </div>   
  </div>
</div>
